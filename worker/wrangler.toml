name = "forex-trading-stats"
main = "src/index.js"
compatibility_date = "2026-09-01"

# Not a secret: the project id is in every Firebase config file already.
[vars]
FIREBASE_PROJECT_ID = "forex-9f21b"

# Secrets, set once with:
#   npx wrangler secret put FIREBASE_CLIENT_EMAIL
#   npx wrangler secret put FIREBASE_PRIVATE_KEY
# They belong to a service account that can read and write Firestore and
# nothing else. They are never committed.

# 03:00 UTC is 09:00 in Dhaka: the morning reminder that today's points are
# in (the allowance itself resets at midnight on each phone). Every quarter
# hour, event reminders; at 14:00 UTC, streaks about to end; and between the
# quarter hours, bans an admin gave for some days, lifted once they are up.
[triggers]
crons = ["0 3 * * *", "*/15 * * * *", "0 14 * * *", "5,20,35,50 * * * *"]
